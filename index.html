<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rhenish Primary — Python Practice</title>
<script src="https://cdn.jsdelivr.net/pyodide/v0.24.1/full/pyodide.js"></script>
<style>
  :root {
    --navy: #1F3864;
    --navy-light: #2E4E8C;
    --cream: #FAF8F3;
    --card: #FFFFFF;
    --border: #E0DED6;
    --success: #2E7D4F;
    --success-bg: #E7F5EC;
    --danger: #B23A2E;
    --danger-bg: #FBEAE7;
    --muted: #6B6862;
    --code-bg: #1E2430;
    --code-text: #E8EAF0;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--cream);
    color: #2A2A28;
  }
  .wrap { max-width: 900px; margin: 0 auto; padding: 24px 20px 60px; }
  .top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
    flex-wrap: wrap;
    gap: 12px;
  }
  h1 { font-size: 22px; margin: 0; color: var(--navy); }
  .sub { font-size: 13px; color: var(--muted); margin-top: 2px; }
  .tabs { display: flex; gap: 8px; }
  .tab-btn {
    padding: 8px 16px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--navy);
    font-size: 14px;
    cursor: pointer;
    font-weight: 600;
  }
  .tab-btn.active { background: var(--navy); color: #fff; border-color: var(--navy); }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px 20px;
    margin-bottom: 16px;
  }
  label { font-size: 13px; font-weight: 600; color: var(--navy); display: block; margin-bottom: 6px; }
  input[type=text], select {
    width: 100%;
    padding: 9px 10px;
    border-radius: 8px;
    border: 1px solid var(--border);
    font-size: 14px;
    font-family: inherit;
  }
  .row { display: flex; gap: 14px; flex-wrap: wrap; margin-bottom: 10px; }
  .row > div { flex: 1; min-width: 180px; }
  .exercise-desc {
    background: #F3F1EA;
    border-radius: 8px;
    padding: 12px 14px;
    font-size: 14px;
    line-height: 1.5;
    margin: 10px 0 14px;
  }
  textarea#editor {
    width: 100%;
    min-height: 180px;
    background: var(--code-bg);
    color: var(--code-text);
    font-family: "Consolas", "Monaco", monospace;
    font-size: 14px;
    line-height: 1.5;
    padding: 14px;
    border-radius: 8px;
    border: none;
    resize: vertical;
    tab-size: 4;
  }
  .btn {
    padding: 10px 18px;
    border-radius: 8px;
    border: none;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  .btn-primary { background: var(--navy); color: #fff; }
  .btn-primary:disabled { background: #A9B4C8; cursor: not-allowed; }
  .btn-success { background: var(--success); color: #fff; }
  .btn-success:disabled { background: #A9C9B5; cursor: not-allowed; }
  .btn-ghost { background: transparent; color: var(--navy); border: 1px solid var(--border); }
  .btn-row { display: flex; gap: 10px; margin-top: 12px; flex-wrap: wrap; }
  #status { font-size: 13px; color: var(--muted); margin-top: 8px; }
  .result-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 10px;
    border-radius: 6px;
    font-size: 13px;
    margin-bottom: 6px;
  }
  .result-pass { background: var(--success-bg); color: var(--success); }
  .result-fail { background: var(--danger-bg); color: var(--danger); }
  .score-banner {
    font-size: 16px;
    font-weight: 700;
    color: var(--navy);
    margin-top: 14px;
    padding-top: 12px;
    border-top: 1px solid var(--border);
  }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); }
  th { color: var(--navy); font-size: 12px; text-transform: uppercase; letter-spacing: 0.03em; }
  .empty-note { color: var(--muted); font-size: 14px; padding: 20px 0; text-align: center; }
  .note {
    font-size: 12px;
    color: var(--muted);
    margin-top: 4px;
  }
  textarea.note-field {
    width: 100%;
    min-height: 60px;
    padding: 9px 10px;
    border-radius: 8px;
    border: 1px solid var(--border);
    font-size: 14px;
    font-family: inherit;
    resize: vertical;
  }
  #reportCard { display: none; }
  .report-page {
    background: #fff;
    padding: 10px 4px 4px;
  }
  .report-head {
    text-align: center;
    margin-bottom: 18px;
  }
  .report-head h2 {
    margin: 0 0 4px;
    color: var(--navy);
    font-size: 20px;
  }
  .report-head .sub2 { font-size: 14px; color: var(--muted); }
  .report-info-table, .report-score-table {
    width: 100%;
    border-collapse: collapse;
    margin-bottom: 16px;
  }
  .report-info-table td {
    border: 1px solid var(--border);
    padding: 8px 10px;
    font-size: 13px;
  }
  .report-score-table th, .report-score-table td {
    border: 1px solid var(--border);
    padding: 8px 10px;
    font-size: 13px;
    text-align: left;
  }
  .report-score-table th { background: #EEF2F8; color: var(--navy); }
  .report-total-row td { font-weight: 700; background: #F7F5EF; }
  .report-section-title {
    background: var(--navy);
    color: #fff;
    font-size: 13px;
    font-weight: 700;
    padding: 6px 10px;
    margin: 16px 0 8px;
  }
  .report-comment-box {
    border: 1px solid var(--border);
    min-height: 50px;
    padding: 10px;
    font-size: 13px;
    white-space: pre-wrap;
  }
  .report-sign-row {
    display: flex;
    gap: 40px;
    margin-top: 40px;
  }
  .report-sign-row > div { flex: 1; border-top: 1px solid #888; padding-top: 6px; font-size: 12px; color: var(--muted); font-style: italic; }
  @media print {
    .tabs, .no-print { display: none !important; }
    body { background: #fff; }
    body.report-print-mode .app-shell { display: none !important; }
    body.report-print-mode #reportCard { display: block !important; }
  }
</style>
</head>
<body>
<div class="wrap">
<div class="app-shell">

  <div class="top">
    <div>
      <h1>Rhenish Primary — Python Practice</h1>
      <div class="sub">Coding &amp; Robotics · Python Basics · Grade 4–5</div>
    </div>
    <div class="tabs no-print">
      <button class="tab-btn active" id="tab-student" onclick="switchTab('student')">Practice</button>
      <button class="tab-btn" id="tab-teacher" onclick="switchTab('teacher')">Teacher view</button>
    </div>
  </div>

  <div id="view-student">
    <div class="card">
      <div class="row">
        <div>
          <label for="learnerName">Your name</label>
          <input type="text" id="learnerName" placeholder="First and last name">
        </div>
        <div>
          <label for="learnerClass">Class</label>
          <input type="text" id="learnerClass" placeholder="e.g. 4A">
        </div>
        <div>
          <label for="exerciseSelect">Exercise</label>
          <select id="exerciseSelect" onchange="loadExercise()"></select>
        </div>
      </div>
      <div class="exercise-desc" id="exerciseDesc"></div>
      <label for="editor">Your code</label>
      <textarea id="editor" spellcheck="false"></textarea>
      <div class="btn-row">
        <button class="btn btn-primary" id="runBtn" onclick="runTests()" disabled>Loading Python…</button>
        <button class="btn btn-success" id="submitBtn" onclick="submitResult()" disabled>Save my score</button>
        <button class="btn btn-ghost" onclick="resetCode()">Reset starter code</button>
      </div>
      <div id="status"></div>
      <div id="results"></div>
    </div>
  </div>

  <div id="view-teacher" style="display:none;">
    <div class="card no-print">
      <div class="row">
        <div>
          <label for="learnerFilter">Filter by learner (optional)</label>
          <input type="text" id="learnerFilter" placeholder="Leave blank to show everyone" oninput="renderTeacherTable()">
        </div>
      </div>
      <div class="btn-row">
        <button class="btn btn-ghost" onclick="loadTeacherData()">Refresh results</button>
        <button class="btn btn-primary" onclick="window.print()">Print full class table</button>
      </div>
      <div class="note">Results are saved to shared storage for this practice page — visible to anyone with the link.</div>
    </div>
    <div class="card">
      <div id="teacherTableWrap"><div class="empty-note">Click "Refresh results" to load learner scores.</div></div>
    </div>

    <div class="card no-print">
      <label for="reportLearnerSelect">Build a printable assessment report for</label>
      <div class="row">
        <div>
          <select id="reportLearnerSelect"></select>
        </div>
      </div>
      <label for="strengthsField">Strengths</label>
      <textarea class="note-field" id="strengthsField" placeholder="e.g. Confident with functions and logic."></textarea>
      <label for="focusField" style="margin-top:10px;">Focus area for next term</label>
      <textarea class="note-field" id="focusField" placeholder="e.g. Practise working with lists."></textarea>
      <div class="btn-row">
        <button class="btn btn-ghost" onclick="buildReport()">Preview report</button>
        <button class="btn btn-primary" onclick="printReport()">Print report</button>
      </div>
      <div class="note">Comments are saved per learner so you can come back and edit them later.</div>
    </div>
  </div>

</div>

<div id="reportCard"></div>

</div>

<script>
const EXERCISES = [
  {
    id: "print_basic",
    mode: "output",
    title: "1. The print() function",
    starter: "# Use print() below to display the message\n\n",
    desc: "Use the <code>print()</code> function to display exactly this message on the screen: <strong>Hello, World!</strong>",
    checks: [
      { type: "equals", expected: "Hello, World!" }
    ]
  },
  {
    id: "comments",
    mode: "output",
    title: "2. Comments with #",
    starter: "print(\"I love Python!\")\n",
    desc: "Add a comment above the print statement, starting with <code>#</code>, explaining what the line does. Keep the print statement working so it still shows: <strong>I love Python!</strong>",
    checks: [
      { type: "comment" },
      { type: "equals", expected: "I love Python!" }
    ]
  },
  {
    id: "multiline",
    mode: "output",
    title: "3. Multi-line strings",
    starter: "print(\"\"\"\n\n\"\"\")\n",
    desc: "Use one <code>print()</code> statement with a triple-quoted string (<code>\"\"\" \"\"\"</code>) to display these three lines exactly:<br><br>Coding Club<br>Grade 4<br>Rhenish Primary",
    checks: [
      { type: "equals", expected: "Coding Club\nGrade 4\nRhenish Primary" }
    ]
  },
  {
    id: "variables",
    mode: "output",
    title: "4. Variables",
    starter: "# create your variables below\n\n\nprint(f\"I am {age} years old and in grade {grade}\")\n",
    desc: "Create a variable called <code>age</code> set to 12, and a variable called <code>grade</code> set to 5. The last line already prints them for you — don't change it. You should get exactly: <strong>I am 12 years old and in grade 5</strong>",
    checks: [
      { type: "equals", expected: "I am 12 years old and in grade 5" }
    ]
  },
  {
    id: "math",
    mode: "output",
    title: "5. Math operators",
    starter: "bags = 3\nsweets_per_bag = 15\nextra = 2\n\n# calculate the total and print ONLY the number\n",
    desc: "Using the variables already given, calculate the total sweets (3 bags of 15 sweets each, plus 2 extra) and print just the number. You should get exactly: <strong>47</strong>",
    checks: [
      { type: "equals", expected: "47" }
    ]
  },
  {
    id: "input_greet",
    mode: "output_input",
    title: "6. Getting input from the user",
    starter: "name = input(\"What is your name? \")\n# print a welcome message using name, e.g. Hello, Zoe! Welcome to Python.\n",
    desc: "Use <code>input()</code> to ask \"What is your name?\", store the answer in a variable called <code>name</code>, then print: <strong>Hello, &lt;name&gt;! Welcome to Python.</strong> (with whatever name was typed in)",
    tests: [
      { inputs: ["Zoe"], expected: "Hello, Zoe! Welcome to Python." },
      { inputs: ["Sam"], expected: "Hello, Sam! Welcome to Python." },
      { inputs: ["Thabo"], expected: "Hello, Thabo! Welcome to Python." }
    ]
  },
  {
    id: "ifelse",
    mode: "output",
    title: "7. If statements",
    starter: "num = -4\n\n# write an if/else below that prints \"Negative\" if num is less than 0,\n# otherwise prints \"Positive or zero\"\n",
    desc: "The variable <code>num</code> is already set to -4. Write an if/else statement that prints exactly \"Negative\" if num is less than 0, otherwise prints \"Positive or zero\".",
    checks: [
      { type: "equals", expected: "Negative" }
    ]
  },
  {
    id: "greet",
    mode: "function",
    title: "8. Write a function: greet a friend",
    fn: "greet",
    starter: "def greet(name):\n    # return a greeting like \"Hello, Zoe!\"\n    return \"\"\n",
    desc: "Complete the function <code>greet(name)</code> so it returns the text \"Hello, \" followed by the name and an exclamation mark. Example: greet(\"Zoe\") should return \"Hello, Zoe!\"",
    tests: [
      { args: ["Zoe"], expected: "Hello, Zoe!" },
      { args: ["Sam"], expected: "Hello, Sam!" },
      { args: ["Thabo"], expected: "Hello, Thabo!" }
    ]
  },
  {
    id: "add",
    mode: "function",
    title: "9. Write a function: add two numbers",
    fn: "add_numbers",
    starter: "def add_numbers(a, b):\n    # return the sum of a and b\n    return 0\n",
    desc: "Complete <code>add_numbers(a, b)</code> so it returns the sum of the two numbers.",
    tests: [
      { args: [2, 3], expected: 5 },
      { args: [10, 15], expected: 25 },
      { args: [-4, 9], expected: 5 }
    ]
  },
  {
    id: "even",
    mode: "function",
    title: "10. Write a function: is it even?",
    fn: "is_even",
    starter: "def is_even(n):\n    # return True if n is even, otherwise False\n    return False\n",
    desc: "Complete <code>is_even(n)</code> so it returns True when the number is even, and False when it is odd.",
    tests: [
      { args: [4], expected: true },
      { args: [7], expected: false },
      { args: [0], expected: true }
    ]
  },
  {
    id: "sumlist",
    mode: "function",
    title: "11. Write a function: add up a list",
    fn: "sum_list",
    starter: "def sum_list(numbers):\n    # return the total of all numbers in the list\n    total = 0\n    return total\n",
    desc: "Complete <code>sum_list(numbers)</code> so it adds up every number in the list and returns the total.",
    tests: [
      { args: [[1, 2, 3]], expected: 6 },
      { args: [[10, 20, 30, 40]], expected: 100 },
      { args: [[5]], expected: 5 }
    ]
  },
  {
    id: "vowels",
    mode: "function",
    title: "12. Write a function: count the vowels",
    fn: "count_vowels",
    starter: "def count_vowels(word):\n    # count how many letters a, e, i, o, u are in word\n    count = 0\n    return count\n",
    desc: "Complete <code>count_vowels(word)</code> so it counts how many vowels (a, e, i, o, u — lowercase) are in the word.",
    tests: [
      { args: ["banana"], expected: 3 },
      { args: ["sky"], expected: 0 },
      { args: ["orange"], expected: 3 }
    ]
  }
];

let pyodide = null;
let lastScore = null;

function populateExerciseSelect() {
  const sel = document.getElementById("exerciseSelect");
  sel.innerHTML = EXERCISES.map((e, i) => `<option value="${i}">${e.title}</option>`).join("");
}

function loadExercise() {
  const idx = document.getElementById("exerciseSelect").value;
  const ex = EXERCISES[idx];
  document.getElementById("exerciseDesc").innerHTML = ex.desc;
  document.getElementById("editor").value = ex.starter;
  document.getElementById("results").innerHTML = "";
  document.getElementById("status").textContent = "";
  document.getElementById("submitBtn").disabled = true;
  lastScore = null;
}

function resetCode() {
  const idx = document.getElementById("exerciseSelect").value;
  document.getElementById("editor").value = EXERCISES[idx].starter;
  document.getElementById("results").innerHTML = "";
  document.getElementById("status").textContent = "";
  document.getElementById("submitBtn").disabled = true;
  lastScore = null;
}

function pyEquals(a, b) {
  if (Array.isArray(a) && Array.isArray(b)) {
    return a.length === b.length && a.every((v, i) => pyEquals(v, b[i]));
  }
  return a === b;
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#39;" }[c]));
}

function normalizeOutput(s) {
  return String(s).replace(/\r\n/g, "\n").replace(/[ \t]+$/gm, "").trim();
}

async function runStudentCodeCapture(code) {
  pyodide.globals.set("__student_code__", code);
  pyodide.runPython(`
import sys, io
_stdout_capture = io.StringIO()
_old_stdout = sys.stdout
sys.stdout = _stdout_capture
_error = None
try:
    exec(__student_code__, {})
except Exception as e:
    _error = str(e)
finally:
    sys.stdout = _old_stdout
_captured_output = _stdout_capture.getvalue()
`);
  return {
    output: pyodide.globals.get("_captured_output"),
    error: pyodide.globals.get("_error")
  };
}

async function runOutputModeTests(ex, code, resultsEl, statusEl) {
  const { output, error } = await runStudentCodeCapture(code);
  if (error) {
    statusEl.textContent = "There's an error in your code: " + error;
    resultsEl.innerHTML = "";
    return;
  }
  let passed = 0;
  let html = "";
  for (const check of ex.checks) {
    let ok, label, detail;
    if (check.type === "comment") {
      ok = code.split("\n").some(line => line.trim().startsWith("#"));
      label = "Includes a comment starting with #";
      detail = ok ? "Found a comment" : "No comment found — add a line starting with #";
    } else if (check.type === "contains") {
      ok = output.includes(check.expected);
      label = `Output includes "${escapeHtml(check.expected)}"`;
      detail = ok ? "Found it" : "Not found";
    } else {
      ok = normalizeOutput(output) === normalizeOutput(check.expected);
      label = "Output matches exactly";
      detail = ok ? "Correct" : "Your output was:<br>" + escapeHtml(output || "(nothing printed)");
    }
    if (ok) passed++;
    html += `<div class="result-item ${ok ? "result-pass" : "result-fail"}">
      <span>${label}</span><span>${detail}</span>
    </div>`;
  }
  html += `<div class="score-banner">Score: ${passed} / ${ex.checks.length}</div>`;
  resultsEl.innerHTML = html;
  statusEl.textContent = "";
  lastScore = { passed, total: ex.checks.length, exerciseId: ex.id, exerciseTitle: ex.title };
  document.getElementById("submitBtn").disabled = false;
}

async function runStudentCodeCaptureWithInputs(code, inputs) {
  pyodide.globals.set("__student_code__", code);
  pyodide.globals.set("__test_inputs__", pyodide.toPy(inputs));
  pyodide.runPython(`
import sys, io, builtins
_stdout_capture = io.StringIO()
_old_stdout = sys.stdout
_old_input = builtins.input
_input_iter = iter(list(__test_inputs__))
def _fake_input(prompt=""):
    try:
        return next(_input_iter)
    except StopIteration:
        return ""
builtins.input = _fake_input
sys.stdout = _stdout_capture
_error = None
try:
    exec(__student_code__, {})
except Exception as e:
    _error = str(e)
finally:
    sys.stdout = _old_stdout
    builtins.input = _old_input
_captured_output = _stdout_capture.getvalue()
`);
  return {
    output: pyodide.globals.get("_captured_output"),
    error: pyodide.globals.get("_error")
  };
}

async function runOutputInputModeTests(ex, code, resultsEl, statusEl) {
  let passed = 0;
  let html = "";
  for (const t of ex.tests) {
    let ok, detail;
    try {
      const { output, error } = await runStudentCodeCaptureWithInputs(code, t.inputs);
      if (error) {
        ok = false;
        detail = "Error: " + escapeHtml(error);
      } else {
        ok = normalizeOutput(output).includes(normalizeOutput(t.expected));
        detail = ok ? "Correct" : "Your output was:<br>" + escapeHtml(output || "(nothing printed)");
      }
    } catch (e) {
      ok = false;
      detail = "Error running your code";
    }
    if (ok) passed++;
    html += `<div class="result-item ${ok ? "result-pass" : "result-fail"}">
      <span>Typed in: "${escapeHtml(t.inputs.join(", "))}" → expected "${escapeHtml(t.expected)}"</span>
      <span>${detail}</span>
    </div>`;
  }
  html += `<div class="score-banner">Score: ${passed} / ${ex.tests.length}</div>`;
  resultsEl.innerHTML = html;
  statusEl.textContent = "";
  lastScore = { passed, total: ex.tests.length, exerciseId: ex.id, exerciseTitle: ex.title };
  document.getElementById("submitBtn").disabled = false;
}

async function runTests() {
  const idx = document.getElementById("exerciseSelect").value;
  const ex = EXERCISES[idx];
  const code = document.getElementById("editor").value;
  const resultsEl = document.getElementById("results");
  const statusEl = document.getElementById("status");
  resultsEl.innerHTML = "";
  statusEl.textContent = "Running your code…";
  document.getElementById("submitBtn").disabled = true;

  if (ex.mode === "output") {
    try {
      await runOutputModeTests(ex, code, resultsEl, statusEl);
    } catch (e) {
      statusEl.textContent = "There's an error in your code: " + (e.message ? e.message.split("\n").pop() : String(e));
      resultsEl.innerHTML = "";
    }
    return;
  }

  if (ex.mode === "output_input") {
    try {
      await runOutputInputModeTests(ex, code, resultsEl, statusEl);
    } catch (e) {
      statusEl.textContent = "There's an error in your code: " + (e.message ? e.message.split("\n").pop() : String(e));
      resultsEl.innerHTML = "";
    }
    return;
  }

  try {
    pyodide.runPython("import builtins");
    pyodide.globals.set("__student_code__", code);
    pyodide.runPython(`
_ns = {}
exec(__student_code__, _ns)
`);
    const ns = pyodide.globals.get("_ns");
    const fn = ns.get(ex.fn);
    if (!fn) {
      statusEl.textContent = `Could not find a function called "${ex.fn}". Check your spelling.`;
      return;
    }

    let passed = 0;
    let html = "";
    for (const t of ex.tests) {
      let actual, ok, errMsg = null;
      try {
        const pyArgs = t.args.map(a => Array.isArray(a) ? pyodide.toPy(a) : a);
        const rawResult = fn(...pyArgs);
        actual = (rawResult && typeof rawResult.toJs === "function") ? rawResult.toJs() : rawResult;
        ok = pyEquals(actual, t.expected);
      } catch (e) {
        ok = false;
        errMsg = e.message ? e.message.split("\n").pop() : String(e);
      }
      if (ok) passed++;
      const argsStr = t.args.map(a => JSON.stringify(a)).join(", ");
      html += `<div class="result-item ${ok ? "result-pass" : "result-fail"}">
        <span>${ex.fn}(${argsStr}) → expected ${JSON.stringify(t.expected)}</span>
        <span>${ok ? "Correct" : (errMsg ? "Error: " + errMsg : "Got " + JSON.stringify(actual))}</span>
      </div>`;
    }
    html += `<div class="score-banner">Score: ${passed} / ${ex.tests.length}</div>`;
    resultsEl.innerHTML = html;
    statusEl.textContent = "";
    lastScore = { passed, total: ex.tests.length, exerciseId: ex.id, exerciseTitle: ex.title };
    document.getElementById("submitBtn").disabled = false;
  } catch (e) {
    statusEl.textContent = "There's an error in your code: " + (e.message ? e.message.split("\n").pop() : String(e));
    resultsEl.innerHTML = "";
  }
}

async function submitResult() {
  const name = document.getElementById("learnerName").value.trim();
  const statusEl = document.getElementById("status");
  if (!name) {
    statusEl.textContent = "Please type your name before saving your score.";
    return;
  }
  if (!lastScore) return;
  const learnerClass = document.getElementById("learnerClass").value.trim();
  const key = `results:${name}:${lastScore.exerciseId}`;
  const value = JSON.stringify({
    learner: name,
    learnerClass: learnerClass,
    exerciseId: lastScore.exerciseId,
    exerciseTitle: lastScore.exerciseTitle,
    score: lastScore.passed,
    total: lastScore.total,
    timestamp: new Date().toISOString()
  });
  try {
    await window.storage.set(key, value, true);
    statusEl.textContent = "Saved! Your teacher can now see this score.";
    document.getElementById("submitBtn").disabled = true;
  } catch (e) {
    statusEl.textContent = "Could not save your score. Try again.";
  }
}

function switchTab(tab) {
  document.getElementById("view-student").style.display = tab === "student" ? "block" : "none";
  document.getElementById("view-teacher").style.display = tab === "teacher" ? "block" : "none";
  document.getElementById("tab-student").classList.toggle("active", tab === "student");
  document.getElementById("tab-teacher").classList.toggle("active", tab === "teacher");
  if (tab === "teacher") loadTeacherData();
}

let teacherResults = [];

async function loadTeacherData() {
  const wrap = document.getElementById("teacherTableWrap");
  wrap.innerHTML = `<div class="empty-note">Loading…</div>`;
  try {
    const listResult = await window.storage.list("results:", true);
    const keys = (listResult && listResult.keys) ? listResult.keys : [];
    const rows = [];
    for (const k of keys) {
      try {
        const r = await window.storage.get(k, true);
        if (r && r.value) rows.push(JSON.parse(r.value));
      } catch (e) {}
    }
    teacherResults = rows;
    renderTeacherTable();
    populateReportLearnerSelect();
  } catch (e) {
    wrap.innerHTML = `<div class="empty-note">No results saved yet.</div>`;
  }
}

function populateReportLearnerSelect() {
  const sel = document.getElementById("reportLearnerSelect");
  const names = [...new Set(teacherResults.map(r => r.learner))].sort((a, b) => a.localeCompare(b));
  const current = sel.value;
  sel.innerHTML = names.length
    ? names.map(n => `<option value="${n}">${n}</option>`).join("")
    : `<option value="">No learners yet</option>`;
  if (names.includes(current)) sel.value = current;
  loadNotesForSelectedLearner();
}

async function loadNotesForSelectedLearner() {
  const name = document.getElementById("reportLearnerSelect").value;
  document.getElementById("strengthsField").value = "";
  document.getElementById("focusField").value = "";
  if (!name) return;
  try {
    const r = await window.storage.get(`notes:${name}`, true);
    if (r && r.value) {
      const parsed = JSON.parse(r.value);
      document.getElementById("strengthsField").value = parsed.strengths || "";
      document.getElementById("focusField").value = parsed.focus || "";
    }
  } catch (e) {}
}

document.addEventListener("DOMContentLoaded", () => {
  const sel = document.getElementById("reportLearnerSelect");
  if (sel) sel.addEventListener("change", loadNotesForSelectedLearner);
});

async function saveNotes(name, strengths, focus) {
  try {
    await window.storage.set(`notes:${name}`, JSON.stringify({ strengths, focus }), true);
  } catch (e) {}
}

async function buildReport() {
  const name = document.getElementById("reportLearnerSelect").value;
  const reportCard = document.getElementById("reportCard");
  if (!name) {
    reportCard.innerHTML = `<div class="empty-note">Pick a learner first.</div>`;
    reportCard.style.display = "block";
    return;
  }
  const strengths = document.getElementById("strengthsField").value.trim();
  const focus = document.getElementById("focusField").value.trim();
  await saveNotes(name, strengths, focus);

  const rows = teacherResults.filter(r => r.learner === name);
  const learnerClass = rows.length ? (rows.find(r => r.learnerClass)?.learnerClass || "") : "";
  let totalScore = 0, totalPossible = 0;
  let exerciseRowsHtml = "";
  for (const ex of EXERCISES) {
    const match = rows.find(r => r.exerciseId === ex.id);
    if (match) {
      totalScore += match.score;
      totalPossible += match.total;
      exerciseRowsHtml += `<tr><td>${escapeHtml(ex.title)}</td><td>${match.score} / ${match.total}</td><td>${new Date(match.timestamp).toLocaleDateString()}</td></tr>`;
    } else {
      exerciseRowsHtml += `<tr><td>${escapeHtml(ex.title)}</td><td style="color:var(--muted);">Not attempted</td><td></td></tr>`;
    }
  }
  const pct = totalPossible > 0 ? Math.round((totalScore / totalPossible) * 100) : 0;
  const today = new Date().toLocaleDateString();

  document.getElementById("reportCard").innerHTML = `
    <div class="report-page">
      <div class="report-head">
        <h2>Rhenish Primary School</h2>
        <div class="sub2">Coding &amp; Robotics — Assessment Report</div>
      </div>
      <table class="report-info-table">
        <tr>
          <td style="width:33%;"><strong>Learner:</strong> ${escapeHtml(name)}</td>
          <td style="width:33%;"><strong>Class:</strong> ${escapeHtml(learnerClass || "—")}</td>
          <td style="width:34%;"><strong>Date:</strong> ${today}</td>
        </tr>
      </table>
      <div class="report-section-title">Exercise results</div>
      <table class="report-score-table">
        <tr><th>Exercise</th><th>Score</th><th>Date completed</th></tr>
        ${exerciseRowsHtml}
        <tr class="report-total-row"><td>Overall</td><td>${totalScore} / ${totalPossible} (${pct}%)</td><td></td></tr>
      </table>
      <div class="report-section-title">Strengths</div>
      <div class="report-comment-box">${escapeHtml(strengths) || "—"}</div>
      <div class="report-section-title">Focus area for next term</div>
      <div class="report-comment-box">${escapeHtml(focus) || "—"}</div>
      <div class="report-sign-row">
        <div>Teacher signature</div>
        <div>Parent / guardian signature</div>
      </div>
    </div>
  `;
  document.getElementById("reportCard").style.display = "block";
}

async function printReport() {
  await buildReport();
  document.body.classList.add("report-print-mode");
  window.print();
  setTimeout(() => document.body.classList.remove("report-print-mode"), 500);
}

function renderTeacherTable() {
  const wrap = document.getElementById("teacherTableWrap");
  const filter = document.getElementById("learnerFilter").value.trim().toLowerCase();
  let rows = teacherResults.slice();
  if (filter) rows = rows.filter(r => r.learner.toLowerCase().includes(filter));
  if (rows.length === 0) {
    wrap.innerHTML = `<div class="empty-note">No results found.</div>`;
    return;
  }
  rows.sort((a, b) => a.learner.localeCompare(b.learner) || a.exerciseTitle.localeCompare(b.exerciseTitle));
  let html = `<table><tr><th>Learner</th><th>Exercise</th><th>Score</th><th>Date</th></tr>`;
  for (const r of rows) {
    const d = new Date(r.timestamp);
    const dateStr = isNaN(d) ? "" : d.toLocaleDateString();
    html += `<tr><td>${r.learner}</td><td>${r.exerciseTitle}</td><td>${r.score} / ${r.total}</td><td>${dateStr}</td></tr>`;
  }
  html += `</table>`;
  wrap.innerHTML = html;
}

async function boot() {
  populateExerciseSelect();
  loadExercise();
  document.getElementById("status").textContent = "Loading Python engine (first time may take a moment)…";
  try {
    pyodide = await loadPyodide({ indexURL: "https://cdn.jsdelivr.net/pyodide/v0.24.1/full/" });
    document.getElementById("runBtn").disabled = false;
    document.getElementById("runBtn").textContent = "Run and check my code";
    document.getElementById("status").textContent = "";
  } catch (e) {
    document.getElementById("status").textContent = "Could not load the Python engine. Check your internet connection and reload the page.";
  }
}

boot();
</script>
